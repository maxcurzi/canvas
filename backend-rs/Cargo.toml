[workspace]
resolver = "2"
members = [
    "crates/game-engine",
    "crates/protocol",
    "crates/games/place",
    "crates/games/tetris",
    "crates/games/invaders",
    "crates/games/snake",
    ".",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rand = "0.8"

[package]
name = "canvas-server"
version = "0.1.0"
edition = "2021"

[dependencies]
canvas-game-engine = { path = "crates/game-engine" }
canvas-protocol = { path = "crates/protocol" }
canvas-game-place = { path = "crates/games/place" }
canvas-game-tetris = { path = "crates/games/tetris" }
canvas-game-invaders = { path = "crates/games/invaders" }
canvas-game-snake = { path = "crates/games/snake" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
